<!doctype html>

    <style>
      /* (tutto il tuo CSS invariato) */
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 40px;
        min-height: 100vh;
      }

      .container {
        background: white;
        padding: 20px;
        border-radius: 16px;
        width: 80%;
        max-width: 375px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
      }

      .contatore {
        font-size: 14px;
        color: #555;
        margin-bottom: 15px;
      }

      .testo {
        font-size: 16px;
        margin-bottom: 15px;
        line-height: 1.5;
        text-align: left;
      }

      .sezione {
        margin-bottom: 20px;
        text-align: left;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 14px;
        margin-bottom: 15px;
      }

      .btn {
        width: 40%;
        padding: 12px;
        border: none;
        border-radius: 12px;
        background-color: #ff6f91;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }

      .popup {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .popup-content {
        background: white;
        padding: 20px;
        border-radius: 16px;
        width: 80%;
        max-width: 300px;
        max-height: 70%;
        overflow-y: auto;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

    <div id="input" class="container">
      <div class="contatore" id="contatore"></div>

      <div id="question" class="testo"></div>

      <!-- Input + invia affiancati -->
      <div id="input" class="sezione" style="display: flex; gap: 10px">
        <input
          id="inputRisposta"
          type="text"
          placeholder="Scrivi qui..."
          style="flex: 1; margin-bottom: 0;"
        />
      </div>
      <!-- Bottoni sotto -->
      <div style="display: flex; justify-content: space-between; gap: 10px">
        <button style="margin-left: 8%;" class="btn" style="width: auto" onclick="inviaRisposta()">Invia</button>
        <button style="margin-right: 8%;" class="btn" onclick="confermaSuggerimento()">Suggerimento</button>
      </div>
    </div>

    <!-- Popup INFO -->
    <div id="popupInfo" class="popup hidden">
      <div class="popup-content">
        <p id="messaggio"></p>
        <button onclick="chiudiPopup('popupInfo')">OK</button>
      </div>
    </div>

    <!-- Popup CONFERMA -->
    <div id="popupConferma" class="popup hidden">
      <div class="popup-content">
        <p>Vuoi davvero usare il suggerimento?</p>
        <button onclick="mostraSuggerimento()">Sì</button>
        <button onclick="chiudiPopup('popupConferma')">No</button>
      </div>
    </div>

      async function decryptAnswer(encryptedBase64, counterBase64) {
